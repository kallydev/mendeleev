image: 'rust:latest'

default:
  before_script:
    - rustc --version 
    - cargo --version

stages:
  - checks

msrv:
  stage: checks
  script:
    - rustup toolchain install 1.62
    - cargo +1.62 check --all-features

fmt:
  stage: checks
  script:
    - cargo fmt --check --verbose

lint:
  stage: checks
  script:
    - cargo clippy --profile test -- -D warnings
    - cargo clippy --profile test --features serde -- -D warnings

test:
  stage: checks
  script:
    - cargo test
    - cargo test --no-default-features --features all_no_std_features
    - cargo test --no-default-features --features all_no_std_features,serde
    - cargo test --all-features
