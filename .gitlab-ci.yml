image: 'rust:latest'

default:
  before_script:
    - rustc --version 
    - cargo --version

stages:
  - test

test:
  stage: test
  script:
    - cargo fmt --check --verbose
    - cargo clippy --profile test -- -D warnings
    - cargo clippy --profile test --features serde -- -D warnings
    - cargo test
    - cargo test --no-default-features --features all_no_std_features
    - cargo test --no-default-features --features all_no_std_features,serde
